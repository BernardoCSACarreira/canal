# CI hardening (see CAN-49): pin the hosted runner image so OS upgrades cannot
# silently change glibc/tooling; keep a tiny always-on smoke job so runner or
# Node setup regressions fail even when path-filtered jobs are skipped; weekly
# schedule catches dependency drift on main between PRs.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Runner / Node smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify toolchain
        run: |
          node -p "process.version"
          test -f .nvmrc
          node -e "console.log('runner smoke ok')"

  changes:
    name: Path filter
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.pick.outputs.contracts }}
      ingestion_ui: ${{ steps.pick.outputs.ingestion_ui }}
      ingestion_api: ${{ steps.pick.outputs.ingestion_api }}
      ingestion_edge_go: ${{ steps.pick.outputs.ingestion_edge_go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - '.github/workflows/ci.yml'
              - '.nvmrc'
            ingestion_ui:
              - 'apps/ingestion-ui/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
              - '.nvmrc'
            ingestion_api:
              - 'services/ingestion-api/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
              - '.nvmrc'
            ingestion_edge_go:
              - 'services/ingestion-edge-go/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
              - '.nvmrc'
      - id: pick
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            echo "ingestion_ui=true" >> "$GITHUB_OUTPUT"
            echo "ingestion_api=true" >> "$GITHUB_OUTPUT"
            echo "ingestion_edge_go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "contracts=${{ steps.filter.outputs.contracts }}" >> "$GITHUB_OUTPUT"
          echo "ingestion_ui=${{ steps.filter.outputs.ingestion_ui }}" >> "$GITHUB_OUTPUT"
          echo "ingestion_api=${{ steps.filter.outputs.ingestion_api }}" >> "$GITHUB_OUTPUT"
          echo "ingestion_edge_go=${{ steps.filter.outputs.ingestion_edge_go }}" >> "$GITHUB_OUTPUT"

  contracts:
    name: contracts (OpenAPI validate)
    needs: [changes]
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate OpenAPI
        run: npx --yes @apidevtools/swagger-cli@4 validate contracts/ingestion-v1.openapi.yaml

  ingestion-ui:
    name: ingestion-ui (test + lint + build)
    needs: [changes]
    if: needs.changes.outputs.ingestion_ui == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ingestion-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/ingestion-ui/package-lock.json
      - name: Install
        run: npm ci --include=dev
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  ingestion-api:
    name: ingestion-api (test + build)
    needs: [changes]
    if: needs.changes.outputs.ingestion_api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ingestion-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/ingestion-api/package-lock.json
      - name: Install
        run: npm ci --include=dev
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  ingestion-edge-go:
    name: ingestion-edge-go (test + build)
    needs: [changes]
    if: needs.changes.outputs.ingestion_edge_go == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ingestion-edge-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.12"
      - name: Test
        run: go test ./...
      - name: Build binary
        run: go build -o /tmp/ingestion-edge ./cmd/ingestion-edge
