name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ingestion-ui:
    name: ingestion-ui (test + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ingestion-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/ingestion-ui/package-lock.json
      - name: Install
        run: npm ci --include=dev
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  ingestion-api:
    name: ingestion-api (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/ingestion-api/package-lock.json
      - name: Install
        run: npm ci --include=dev
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
