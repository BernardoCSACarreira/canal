# CI hardening (see CAN-49): pin the hosted runner image so OS upgrades cannot
# silently change glibc/tooling; keep a tiny always-on smoke job so runner or
# Node setup regressions fail even when path-filtered jobs are skipped; weekly
# schedule catches dependency drift on main between PRs.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runner-smoke:
    name: Runner / Node smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify toolchain
        run: |
          node -p "process.version"
          test -f .nvmrc
          node -e "console.log('runner smoke ok')"

  compose-validate:
    name: Default stack (compose file)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose.yaml
        run: docker compose -f compose.yaml config --quiet

  changes:
    name: Path filter
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.pick.outputs.contracts }}
      ingestion_ui: ${{ steps.pick.outputs.ingestion_ui }}
      ingestion_edge_go: ${{ steps.pick.outputs.ingestion_edge_go }}
      ingestion_control_plane: ${{ steps.pick.outputs.ingestion_control_plane }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - '.github/workflows/ci.yml'
              - '.nvmrc'
            ingestion_ui:
              - 'apps/ingestion-ui/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
              - '.nvmrc'
            ingestion_edge_go:
              - 'services/ingestion-edge-go/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
              - '.nvmrc'
              - 'compose.yaml'
              - '.python-version'
              - 'services/ingestion-control-plane/Dockerfile'
              - 'Makefile'
            ingestion_control_plane:
              - 'services/ingestion-control-plane/**'
              - 'contracts/**'
              - '.github/workflows/ci.yml'
              - 'compose.yaml'
              - '.python-version'
              - 'services/ingestion-edge-go/Dockerfile'
              - 'Makefile'
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "contracts=${{ steps.filter.outputs.contracts }}" >> "$GITHUB_OUTPUT"
            echo "ingestion_ui=${{ steps.filter.outputs.ingestion_ui }}" >> "$GITHUB_OUTPUT"
            echo "ingestion_edge_go=${{ steps.filter.outputs.ingestion_edge_go }}" >> "$GITHUB_OUTPUT"
            echo "ingestion_control_plane=${{ steps.filter.outputs.ingestion_control_plane }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            echo "ingestion_ui=true" >> "$GITHUB_OUTPUT"
            echo "ingestion_edge_go=true" >> "$GITHUB_OUTPUT"
            echo "ingestion_control_plane=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # push / schedule: Go + Python ship path on main.
          echo "contracts=true" >> "$GITHUB_OUTPUT"
          echo "ingestion_ui=true" >> "$GITHUB_OUTPUT"
          echo "ingestion_edge_go=true" >> "$GITHUB_OUTPUT"
          echo "ingestion_control_plane=true" >> "$GITHUB_OUTPUT"

  contracts:
    name: contracts (OpenAPI validate)
    needs: [changes]
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate OpenAPI
        run: npx --yes @apidevtools/swagger-cli@4 validate contracts/ingestion-v1.openapi.yaml

  ingestion-ui:
    name: ingestion-ui (test + lint + build)
    needs: [changes]
    if: needs.changes.outputs.ingestion_ui == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/ingestion-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/ingestion-ui/package-lock.json
      - name: Install
        run: npm ci --include=dev
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  ingestion-control-plane:
    name: ingestion-control-plane (ruff + pytest)
    needs: [changes]
    if: needs.changes.outputs.ingestion_control_plane == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ingestion-control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest
      - name: Container image
        run: docker build -t ingestion-control-plane:ci .

  ingestion-edge-go:
    name: ingestion-edge-go (test + build)
    needs: [changes]
    if: needs.changes.outputs.ingestion_edge_go == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/ingestion-edge-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: services/ingestion-edge-go/go.mod
      - name: Format (gofmt)
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build binary
        run: go build -o /tmp/ingestion-edge ./cmd/ingestion-edge
      - name: Container image
        run: docker build -t ingestion-edge-go:ci .
