name: CI

# The compliance audit's standing finding was "no CI configuration at all", so every guard in this
# repository protected only whoever remembered to run it. These jobs are that gap closed.
#
# Two principles shape what is here:
#
#   1. Anything checkable in Go is a Go test, not a step in this file. `internal/arch` holds the
#      dependency-direction, connector-boundary, link and mermaid-well-formedness checks, so a
#      contributor sees them locally from `go test ./...` and CI simply runs the same thing. A gate
#      that only exists in YAML is a gate you cannot reproduce.
#   2. What remains here is what genuinely needs an environment: several platforms and several
#      architectures. Nothing here needs a network beyond the checkout, or a toolchain beyond Go.
#
# There was briefly a fourth job that rendered every mermaid diagram with a headless Chromium. It was
# removed. Beyond the structural checks already in internal/arch, all it caught was a syntax error
# inside a diagram BODY — and the cost was a browser download on every code push, making it by far
# the slowest and least reliable job here. A diagram that fails to parse renders as an error box on
# the GitHub page, so the failure is visible and cosmetic rather than silent and shipped. Wrong trade.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref; main is never cancelled.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately. internal/example/stdoutsink asserts which fsync errnos mean "this
        # descriptor cannot be synced", and those differ per platform: /dev/null answers ENODEV and
        # a pipe answers EBADF on darwin, where Linux answers EINVAL for both. That set was measured
        # on one machine, so it needs the other to stay honest.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod rather than pinning it twice. R9's rule is that one concept
          # gets one spelling, and a Go version hard-coded here would drift from go.mod exactly the
          # way the old contract version drifted across its five copies.
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: test -race
        # The race detector is not optional for this repository. Ledger.send racing Ledger.Close was
        # a real send-on-closed-channel panic in the shutdown window the engine reserves for late
        # acks, and it shipped for as long as nothing ran this.
        run: go test -race ./...

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build ${{ matrix.goos }}/${{ matrix.goarch }}
        # "Two deployment shapes from one binary" is a stated goal, and the sink example reaches for
        # syscall errnos, which is exactly the kind of code that compiles on the author's laptop and
        # nowhere else.
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  deps:
    name: zero dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: no third-party modules
        # "No third-party dependencies" is a property the README advertises. Advertised properties
        # decay unless something enforces them, which is R8's whole point.
        run: |
          deps=$(go list -m all | tail -n +2)
          if [ -n "$deps" ]; then
            echo "::error::the module has acquired third-party dependencies:"
            echo "$deps"
            exit 1
          fi
          echo "zero third-party modules, as advertised"

      - name: go.mod is tidy
        run: |
          cp go.mod go.mod.bak
          [ -f go.sum ] && cp go.sum go.sum.bak
          go mod tidy
          if ! diff -q go.mod go.mod.bak >/dev/null; then
            echo "::error::go mod tidy changed go.mod; commit the result"
            diff -u go.mod.bak go.mod || true
            exit 1
          fi
