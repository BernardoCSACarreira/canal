# Reusable ingestion CI steps (called from ci.yml). Keeps install/test/lint/build
# definitions in one place so caller path logic does not drift from real work.
name: Ingestion CI (reusable)

on:
  workflow_call:
    inputs:
      job_name:
        type: string
        required: true
      suite:
        type: string
        required: true
      should_execute:
        type: boolean
        required: true

jobs:
  suite:
    name: ${{ inputs.job_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no matching paths)
        if: ${{ !inputs.should_execute }}
        run: |
          echo "Skipping ${{ inputs.suite }} — no matching path changes for this PR/push."

      - uses: actions/checkout@v4
        if: ${{ inputs.should_execute }}

      - uses: actions/setup-node@v4
        if: ${{ inputs.should_execute && inputs.suite == 'contracts' }}
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-node@v4
        if: ${{ inputs.should_execute && inputs.suite == 'ingestion-ui' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/ingestion-ui/package-lock.json

      - uses: actions/setup-node@v4
        if: ${{ inputs.should_execute && inputs.suite == 'ingestion-api' }}
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/ingestion-api/package-lock.json

      - name: Validate OpenAPI
        if: ${{ inputs.should_execute && inputs.suite == 'contracts' }}
        run: npx --yes @apidevtools/swagger-cli@4 validate contracts/ingestion-v1.openapi.yaml

      - name: Install
        if: ${{ inputs.should_execute && inputs.suite == 'ingestion-ui' }}
        working-directory: apps/ingestion-ui
        run: npm ci --include=dev

      - name: Install
        if: ${{ inputs.should_execute && inputs.suite == 'ingestion-api' }}
        working-directory: services/ingestion-api
        run: npm ci --include=dev

      - name: Test
        if: ${{ inputs.should_execute && inputs.suite == 'ingestion-ui' }}
        working-directory: apps/ingestion-ui
        run: npm test

      - name: Test
        if: ${{ inputs.should_execute && inputs.suite == 'ingestion-api' }}
        working-directory: services/ingestion-api
        run: npm test

      - name: Lint
        if: ${{ inputs.should_execute && inputs.suite == 'ingestion-ui' }}
        working-directory: apps/ingestion-ui
        run: npm run lint

      - name: Build
        if: ${{ inputs.should_execute && inputs.suite == 'ingestion-ui' }}
        working-directory: apps/ingestion-ui
        run: npm run build

      - name: Build
        if: ${{ inputs.should_execute && inputs.suite == 'ingestion-api' }}
        working-directory: services/ingestion-api
        run: npm run build
