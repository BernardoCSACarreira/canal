openapi: 3.1.0
info:
  title: Canal — Realtime ingestion API (Phase 1 MVP)
  version: 0.1.0
  description: |
    HTTP-first ingestion contract for Phase 1 MVP. Streaming delivery (SSE/WebSocket)
    is reserved for a follow-on iteration; `GET /v1/stream` is a documented stub.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Health
  - name: Ingestion

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness / readiness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/events:
    post:
      tags: [Ingestion]
      summary: Accept a batch of raw ingestion events (idempotent by event id)
      operationId: postIngestEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBatchRequest"
      responses:
        "202":
          description: Events accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestBatchResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/stream:
    get:
      tags: [Ingestion]
      summary: Realtime fan-out (stub — not implemented in MVP scaffold)
      operationId: getIngestStream
      description: |
        Placeholder for future SSE/WebSocket subscription. Implementations SHOULD return
        `501` until streaming is shipped; clients MUST NOT depend on this path in Phase 1.
      responses:
        "501":
          description: Streaming not yet available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: ingestion-api
        version:
          type: string
          example: "0.1.0"

    IngestBatchRequest:
      type: object
      required: [source, events]
      properties:
        source:
          type: string
          description: Logical producer (connector id, app name, etc.)
          minLength: 1
          maxLength: 256
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/IngestEvent"

    IngestEvent:
      type: object
      required: [id, type, occurredAt]
      properties:
        id:
          type: string
          description: Idempotency key for deduplication
          minLength: 1
          maxLength: 128
        type:
          type: string
          description: Event type / schema discriminator
          minLength: 1
          maxLength: 256
        occurredAt:
          type: string
          format: date-time
        payload:
          description: Arbitrary JSON payload
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
            - type: string
            - type: number
            - type: boolean
            - type: "null"

    IngestBatchResponse:
      type: object
      required: [accepted, duplicateIds]
      properties:
        accepted:
          type: integer
          minimum: 0
        duplicateIds:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
